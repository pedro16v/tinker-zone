<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tinker.zone</title>
    <link rel="stylesheet" href="/styles/canvas.css" />
  </head>
  <body>
    <div id="macos-top-bar" class="tz-muted"></div>
    <img src="/capybara-floating.svg" alt="capybara floating in the background" id="capybara" />
    <main id="canvas-root">
      <h1 id="canvas-title">tinker.zone</h1>
      <p id="canvas-tagline">caching test ping</p>
      <h2 class="tz-hero">Minesweeper</h2>
      <p class="tz-muted">A classic grid-based puzzle game where you uncover tiles and avoid hidden mines.</p>
      <div class="tz-pill">🦅</div>
      <div id="win311-calculator" class="win311-window">
        <div class="win311-titlebar">Calculator</div>
        <div class="win311-content">
          <input type="text" id="calc-display" class="win311-display" readonly value="0" />
          <div class="win311-grid">
            <button class="win311-btn" data-val="7">7</button>
            <button class="win311-btn" data-val="8">8</button>
            <button class="win311-btn" data-val="9">9</button>
            <button class="win311-btn op" data-op="/">÷</button>
            <button class="win311-btn" data-val="4">4</button>
            <button class="win311-btn" data-val="5">5</button>
            <button class="win311-btn" data-val="6">6</button>
            <button class="win311-btn op" data-op="*">×</button>
            <button class="win311-btn" data-val="1">1</button>
            <button class="win311-btn" data-val="2">2</button>
            <button class="win311-btn" data-val="3">3</button>
            <button class="win311-btn op" data-op="-">−</button>
            <button class="win311-btn" data-val="0">0</button>
            <button class="win311-btn" data-val=".">.</button>
            <button class="win311-btn equals" data-op="=">=</button>
            <button class="win311-btn op" data-op="+">+</button>
          </div>
        </div>
      </div>
    </main>
    <!-- The widget is injected here at build time from /widget — it is not part of this file. -->
    <script src="/scripts/canvas.js"></script>
  </body>
</html>
