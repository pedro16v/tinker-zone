name: deploy

# Production deploy to Vercel on every push to main (i.e. after a bake PR auto-merges).
# Uses the Vercel CLI + a VERCEL_TOKEN secret — no third-party GitHub app touches the repo.
# The deploy URL it prints is the immutable per-deploy URL the time machine will record (M6).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tz-deploy
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings (production)
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy prebuilt to production
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")
          echo "Deployed: $url"
          echo "deploy_url=$url" >> "$GITHUB_OUTPUT"

      - name: Notify deploy-confirm if this was a batched bake
        if: steps.deploy.outputs.deploy_url
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy_url }}
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # The bake commit's body contains "batch-id: <uuid>" (M4). For non-batched pushes
          # (e.g. my infra commits) the line is absent and we silently skip.
          BATCH_ID=$(git log -1 --format='%B' | grep -m1 -E '^batch-id:' | sed 's/^batch-id:[[:space:]]*//' || true)
          if [ -z "$BATCH_ID" ]; then
            echo "no batch-id in commit body — skipping deploy-confirm"
            exit 0
          fi
          if [ -z "$SB_KEY" ]; then
            echo "WARN: SUPABASE_SERVICE_ROLE_KEY not set; can't notify deploy-confirm"
            exit 0
          fi
          curl -sS -X POST "https://ebtbzmjpumglqbyopifn.supabase.co/functions/v1/deploy-confirm" \
            -H "Authorization: Bearer $SB_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"batch_id\": \"${BATCH_ID}\", \"deploy_url\": \"${DEPLOY_URL}\"}"
