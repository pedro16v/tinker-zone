name: automerge

# Enable auto-merge on bake PRs. With branch protection requiring the `validate` check,
# GitHub holds the merge until checks pass, then merges automatically.
#
# Prereqs: repo setting "Allow auto-merge" enabled + branch protection on main requiring
# `validate`. Update the bot login below to match the installed GitHub App.

on:
  pull_request:
    types: [opened, reopened, labeled]

permissions:
  contents: read

jobs:
  enable:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'bake') ||
      endsWith(github.event.pull_request.user.login, '[bot]')
    runs-on: ubuntu-latest
    steps:
      # Use the scoped App token (NOT the default GITHUB_TOKEN), so the eventual merge push
      # is treated as a third-party action and DOES trigger downstream workflows (deploy.yml).
      - name: Mint scoped App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Enable auto-merge (squash)
        run: gh pr merge --auto --squash "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
